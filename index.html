<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תוכניות">
<meta name="theme-color" content="#f4f2ee">
<title>עורך תוכניות קומה</title>
<style>
:root{
  --bg:#f4f2ee;--panel:#ffffff;--ink:#1f2328;--muted:#6b7078;--line:#dcd8d0;
  --accent:#1565c0;--accent-weak:#e3eefb;--danger:#c62828;--ok:#2e7d32;--dim:#00897b;
  --btn:52px;--radius:14px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew","Segoe UI",Arial,sans-serif;font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:6px;padding:calc(6px + var(--st)) calc(8px + var(--sr)) 6px calc(8px + var(--sl));
  background:var(--panel);border-bottom:1px solid var(--line);min-height:calc(60px + var(--st))}
#title{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#projName{background:none;border:0;font-weight:600;font-size:17px;padding:8px 6px;border-radius:10px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
#floorSel{height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 8px;max-width:150px}
.ib{width:var(--btn);height:var(--btn);min-width:var(--btn);border-radius:var(--radius);border:0;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:0}
.ib:active{background:#ebe8e2}
.ib:disabled{opacity:.3}
.ib svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tools{display:flex;gap:2px;padding:6px calc(6px + var(--sr)) calc(6px + var(--sb)) calc(6px + var(--sl));background:var(--panel);
  border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;order:2}
#tools::-webkit-scrollbar{display:none}
.tb{min-width:58px;height:60px;border-radius:var(--radius);border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink);padding:0 4px;flex:0 0 auto}
.tb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.tb.tog.on{background:#e8f3ea;color:var(--ok)}
.tb .big{font-size:20px;font-weight:700;line-height:26px}
.sep{width:1px;background:var(--line);margin:8px 4px;flex:0 0 1px}
#toolopts{position:absolute;top:10px;right:10px;left:10px;display:none;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:3}
#toolopts.show{display:flex}
#toolopts>*{pointer-events:auto}
.chip{height:46px;border-radius:23px;border:1px solid var(--line);background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:15px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip select,.chip input{border:0;background:transparent;height:40px;font-size:15px;outline:none}
.chip input{width:58px;text-align:center}
.chip.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.chip .seg button{height:34px;padding:0 10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;flex:0 0 auto}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
#hud{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:rgba(31,35,40,.88);color:#fff;border-radius:14px;
  padding:8px 16px;font-size:20px;font-weight:600;display:none;z-index:4;pointer-events:none;white-space:nowrap;direction:rtl}
#hud.show{display:block}
#toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;border-radius:12px;
  padding:10px 16px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
#dimEdit{position:absolute;display:none;width:100px;height:46px;transform:translate(-50%,-50%);font-size:19px;font-weight:600;text-align:center;
  border:2px solid var(--dim);border-radius:12px;z-index:7;direction:ltr;background:#fff;color:var(--dim);-webkit-user-select:text;user-select:text;
  box-shadow:0 4px 16px rgba(0,0,0,.18);outline:none}
/* panel: compact bottom strip on phones, floating card on wide screens */
#panel{position:absolute;left:0;right:0;bottom:0;max-height:42%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.12);padding:6px 10px 10px;z-index:5;display:none;-webkit-overflow-scrolling:touch}
#panel.show{display:block}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:4px;min-height:40px}
.ph h3{margin:0;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .id{font-size:11px;color:var(--muted);direction:ltr;white-space:nowrap}
.ph .ib{width:40px;height:40px;min-width:40px}
.ph .ib svg{width:22px;height:22px}
.badge{font-size:11px;background:#fff3e0;color:#a75a00;border-radius:8px;padding:2px 7px;direction:ltr;white-space:nowrap}
.fields{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:flex-end}
.fields::-webkit-scrollbar,.acts::-webkit-scrollbar{display:none}
.field{flex:0 0 auto;display:flex;flex-direction:column;gap:3px}
.field>label{font-size:12px;color:var(--muted);white-space:nowrap}
.num{height:44px;width:82px;border:1px solid var(--line);border-radius:11px;padding:0 6px;font-size:17px;text-align:center;
  direction:ltr;background:#fff;-webkit-user-select:text;user-select:text}
.txt{height:44px;width:150px;border:1px solid var(--line);border-radius:11px;padding:0 10px;font-size:16px;background:#fff;-webkit-user-select:text;user-select:text}
.num:focus,.txt:focus{outline:2px solid var(--accent);border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:0 0 auto}
.seg button{height:44px;border:0;background:#fff;padding:0 11px;font-size:14px;border-inline-start:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--accent);color:#fff}
.swrow{display:flex;gap:6px;height:44px;align-items:center}
.sel{height:44px;border:1px solid var(--line);border-radius:11px;padding:0 8px;background:#fff;font-size:15px;min-width:120px}
.info{height:44px;display:flex;align-items:center;font-size:18px;font-weight:600;padding:0 4px;direction:rtl;white-space:nowrap}
.acts{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.btn{height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:16px;display:inline-flex;
  align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap}
.btn.sm{height:42px;padding:0 12px;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger);border-color:#f0c9c9}
.btn:active{filter:brightness(.94)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
#panel .hint{display:none}
#panel.mini .fields,#panel.mini .acts,#panel.mini .hint{display:none!important}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg.show{display:flex}
.dlg .box{background:#fff;border-radius:18px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h2{margin:0 0 10px;font-size:20px}
.dlg textarea{width:100%;height:42vh;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;
  direction:ltr;text-align:left;-webkit-user-select:text;user-select:text;resize:vertical}
.dlg .acts{flex-wrap:wrap;margin-top:12px}
.err{color:var(--danger);font-size:14px;margin-top:8px;white-space:pre-wrap;direction:rtl}
#menu .box{width:min(380px,100%)}
#menu .mi{display:flex;width:100%;height:56px;align-items:center;gap:12px;border:0;background:none;font-size:17px;padding:0 8px;border-radius:12px}
#menu .mi:active{background:#f1efea}
#menu .mi svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#furnGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
#furnGrid button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;min-height:108px}
#furnGrid button:active{background:var(--accent-weak)}
#furnGrid canvas{width:64px;height:64px}
@media (min-width:860px){
  #main{flex-direction:row}
  #tools{order:0;flex-direction:column;border-top:0;border-inline-end:1px solid var(--line);padding:8px 6px calc(8px + var(--sb));overflow-y:auto;overflow-x:hidden}
  .tb{min-width:72px;height:64px}
  .sep{width:auto;height:1px;margin:4px 8px;flex:0 0 1px}
  #panel{left:12px;right:auto;bottom:auto;top:12px;width:360px;max-height:calc(100% - 24px);border-radius:18px;border:1px solid var(--line);
    box-shadow:0 8px 30px rgba(0,0,0,.14);padding:10px 14px 14px}
  .fields{flex-wrap:wrap;overflow:visible;gap:10px}
  .acts{flex-wrap:wrap}
  #panel .hint{display:block}
  #toolopts{left:auto}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="ib" id="bMenu" aria-label="תפריט"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div id="title"><button id="projName" title="שינוי שם"></button><select id="floorSel" aria-label="קומה" hidden></select></div>
    <button class="ib" id="bFit" aria-label="התאם למסך"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="bRedo" aria-label="שחזור"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/></svg></button>
    <button class="ib" id="bUndo" aria-label="ביטול"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12h2" transform="translate(0 -6)"/></svg></button>
  </header>
  <div id="main">
    <nav id="tools">
      <button class="tb" data-tool="select"><svg viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1 3.5 7-2.5 1.2-3.5-7L6 18z"/></svg>בחירה</button>
      <button class="tb" data-tool="wall"><svg viewBox="0 0 24 24"><path d="M3 20V8h8V4h10" stroke-width="3.2"/><circle cx="3" cy="20" r="1.6" fill="currentColor"/><circle cx="21" cy="4" r="1.6" fill="currentColor"/></svg>קיר</button>
      <button class="tb" data-tool="door"><svg viewBox="0 0 24 24"><path d="M2 20h4M18 20h4" stroke-width="3.2"/><path d="M6 20V6"/><path d="M6 6a14 14 0 0 1 12 14"/></svg>דלת</button>
      <button class="tb" data-tool="window"><svg viewBox="0 0 24 24"><path d="M2 12h4M18 12h4" stroke-width="3.2"/><rect x="6" y="9" width="12" height="6"/><path d="M6 12h12"/></svg>חלון</button>
      <button class="tb" data-tool="furniture"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="2"/><path d="M3 11h18M6 8V5h12v3"/></svg>ריהוט</button>
      <button class="tb" data-tool="line"><svg viewBox="0 0 24 24"><path d="M4 19L20 5" stroke="#e53935" stroke-width="2.6"/><circle cx="4" cy="19" r="1.8" fill="currentColor"/><circle cx="20" cy="5" r="1.8" fill="currentColor"/></svg>קו</button>
      <button class="tb" data-tool="area"><svg viewBox="0 0 24 24"><path d="M4 6l11-2 5 9-7 7-9-3z" fill="rgba(30,136,229,.3)" stroke="#1e88e5"/></svg>אזור</button>
      <div class="sep"></div>
      <button class="tb tog" id="tSnap"><svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3z"/><path d="M6 7h4M14 7h4"/></svg>הצמדה</button>
      <button class="tb tog" id="tRound"><span class="big">5</span>עיגול ס"מ</button>
      <button class="tb tog" id="tJoin"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span id="tJoinL">מחובר</span></button>
      <button class="tb tog" id="tFinger"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5m0-1a1.5 1.5 0 0 1 3 0v2m0-1a1.5 1.5 0 0 1 3 0v4a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.6-1.5L9 15"/></svg>אצבע מציירת</button>
    </nav>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toolopts"></div>
      <div id="hud"></div>
      <div id="toast"></div>
      <input id="dimEdit" inputmode="decimal" enterkeyhint="done" autocomplete="off">
      <aside id="panel"></aside>
    </div>
  </div>
</div>

<div class="dlg" id="menu"><div class="box">
  <button class="mi" data-act="import"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>ייבוא JSON</button>
  <button class="mi" data-act="export"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 19h16"/></svg>ייצוא JSON</button>
  <button class="mi" data-act="png"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>ייצוא PNG</button>
  <button class="mi" data-act="rename"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>שינוי שם התוכנית</button>
  <button class="mi" data-act="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>תוכנית חדשה</button>
  <div class="hint" style="padding:6px 8px">פורמט: OpenPlan3D web project JSON · ס"מ · x ימינה, y למטה · נשמר אוטומטית במכשיר</div>
  <div class="acts"><button class="btn" data-close>סגור</button></div>
</div></div>

<div class="dlg" id="dImport"><div class="box">
  <h2>ייבוא JSON</h2>
  <textarea id="impText" placeholder="הדבק כאן JSON של OpenPlan3D" spellcheck="false"></textarea>
  <div class="err" id="impErr"></div>
  <div class="acts">
    <button class="btn primary" id="impGo">ייבא</button>
    <button class="btn" id="impPaste">הדבק מהלוח</button>
    <button class="btn" id="impFileBtn">בחר קובץ…</button>
    <input type="file" id="impFile" accept=".json,application/json,text/plain" hidden>
    <button class="btn" data-close>ביטול</button>
  </div>
</div></div>

<div class="dlg" id="dExport"><div class="box">
  <h2>ייצוא JSON</h2>
  <textarea id="expText" readonly spellcheck="false"></textarea>
  <div class="acts">
    <button class="btn primary" id="expCopy">העתק</button>
    <button class="btn" id="expDown">הורד קובץ</button>
    <button class="btn" id="expShare" hidden>שתף…</button>
    <button class="btn" data-close>סגור</button>
  </div>
</div></div>

<div class="dlg" id="dFurn"><div class="box">
  <h2>ריהוט</h2>
  <div class="hint">בחר פריט ואז הקש על התוכנית במקום שבו הוא יוצב</div>
  <div id="furnGrid"></div>
  <div class="acts"><button class="btn" data-close>סגור</button></div>
</div></div>

<script>
'use strict';
(function(){
/* ============ constants ============ */
const LS_PROJECT='planEditor.project.v1', LS_SETTINGS='planEditor.settings.v1';
// markupLines / markupPolygons are this editor's own floor keys; OpenPlan3D keeps unknown keys untouched.
const ARR={wall:'walls',door:'doors',window:'windows',furniture:'furniture',line:'markupLines',polygon:'markupPolygons'};
const KIND_HE={wall:'קיר',door:'דלת',window:'חלון',furniture:'ריהוט',line:'קו',polygon:'אזור'};
const DRAW_TOOLS=new Set(['wall','line','area']);
const COLORS=['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#fdd835','#212121'];
const WALL_TYPES=[
  {name:'קיר חוץ 20',t:20},{name:'קיר חוץ 25',t:25},{name:'קיר חוץ 30',t:30},
  {name:'בטון 20',t:20},{name:'בטון 30 (ממ"ד)',t:30},
  {name:'בלוק פנים 10',t:10},{name:'בלוק פנים 12',t:12},{name:'גבס 10',t:10},{name:'גבס 15',t:15}
];
// Render table for every catalog id we may meet (W×D defaults from OpenPlan3D). Back of an object is -y, front +y; bed head at -x.
// living_block / kitchen_u are written as catalogId "imported_object" + sourceCategory, as the OpenPlan3D spec asks for non-catalog items.
const CATALOG=[
  ['bed_queen','מיטה זוגית',200,150,'bed'],['bed_twin','מיטת יחיד',190,100,'bed'],['nightstand','שידת לילה',50,40,'box'],
  ['wardrobe','ארון',120,60,'wardrobe'],['dresser','קומודה',120,50,'box'],
  ['sofa','ספה',200,90,'sofa'],['loveseat','ספה דו-מושבית',140,85,'sofa'],['chair','כורסה',80,80,'sofa'],
  ['coffee_table','שולחן סלון',120,60,'table'],['tv_stand','מזנון',150,45,'box'],['bookshelf','ספרייה',80,30,'shelf'],
  ['dining_table','שולחן אוכל',120,80,'dining'],['dining_chair','כיסא',45,45,'chair'],['table','שולחן',100,60,'table'],
  ['desk','שולחן עבודה',140,70,'table'],['office_chair','כיסא משרדי',45,45,'ochair'],
  ['toilet','אסלה',40,65,'toilet'],['sink_b','כיור עם ארונית',60,45,'vanity'],['shower','מקלחת',90,90,'shower'],
  ['bathtub','אמבטיה',170,75,'bath'],['washer_dryer','מכונת כביסה',60,65,'washer'],
  ['counter','משטח מטבח',120,60,'counter'],['sink_k','כיור מטבח',60,45,'ksink'],['stove','כיריים',60,60,'stove'],
  ['oven','תנור',60,60,'oven'],['fridge','מקרר',70,70,'fridge'],['dishwasher','מדיח',60,60,'dish'],
  ['living_block','בלוק סלון',330,300,'living'],['kitchen_u','מטבח ח',300,240,'kitchen']
].map(a=>({id:a[0],he:a[1],w:a[2],d:a[3],sym:a[4]}));
const CAT=Object.fromEntries(CATALOG.map(c=>[c.id,c]));
const CUSTOM=new Set(['living_block','kitchen_u']);
// The palette: what can be placed. extra = keys written on the new element.
const PALETTE=[
  {key:'living_block',he:'בלוק סלון',w:330,d:300},
  {key:'dining_table',he:'שולחן אוכל',w:160,d:90},
  {key:'bed_queen',he:'מיטה זוגית + שידות',w:200,d:160,extra:{nightstands:'both'}},
  {key:'bed_queen',he:'מיטה זוגית',w:200,d:160,extra:{nightstands:'none'}},
  {key:'bed_twin',he:'מיטת יחיד + שידה',w:200,d:90,extra:{nightstands:'right'}},
  {key:'bed_twin',he:'מיטת יחיד',w:200,d:90,extra:{nightstands:'none'}},

function validate(p){
  const errs=[];const isNum=v=>typeof v==='number'&&isFinite(v);const isPt=v=>v&&isNum(v.x)&&isNum(v.y);
  if(!p||typeof p!=='object'||Array.isArray(p))return['הקובץ אינו אובייקט JSON'];
  if(p.openplanPrepared===true||'openplanHandoffVersion' in p)return['זה קובץ interchange (RoomPlan, מטרים). העורך קורא web project JSON בס"מ — ייצא מ-OpenPlan3D דרך Export → Download JSON'];
  if(typeof p.id!=='string'||!p.id)errs.push('id: חסר מזהה פרויקט');
  if(!Array.isArray(p.floors)||!p.floors.length)return errs.concat('floors: חייבת להיות לפחות קומה אחת');
  p.floors.forEach((f,fi)=>{
    const P='floors['+fi+']';
    if(!f||typeof f!=='object'){errs.push(P+': קומה לא תקינה');return}
    if(!Array.isArray(f.walls)){errs.push(P+'.walls: חייב להיות מערך');return}
    const ids=new Set();
    const chk=(k)=>(f[k]||[]).forEach((e,i)=>{if(!e||typeof e.id!=='string'&&typeof e.id!=='number'){errs.push(P+'.'+k+'['+i+'].id: חסר');return}
      if(ids.has(String(e.id)))errs.push(P+'.'+k+'['+i+'].id: כפול ('+e.id+')');ids.add(String(e.id))});
    ['walls','doors','windows','furniture','markupLines','markupPolygons'].forEach(chk);
    f.walls.forEach((w,i)=>{if(!isPt(w.start)||!isPt(w.end))errs.push(P+'.walls['+i+']: start/end חסרים');
      if(!(w.thickness>0))errs.push(P+'.walls['+i+'].thickness: חייב להיות גדול מאפס')});
    const wids=new Set(f.walls.map(w=>String(w.id)));
    ['doors','windows'].forEach(k=>(f[k]||[]).forEach((o,i)=>{
      if(!wids.has(String(o.wallId)))errs.push(P+'.'+k+'['+i+'].wallId: אין קיר כזה בקומה');
      if(!isNum(o.position)||o.position<0||o.position>1)errs.push(P+'.'+k+'['+i+'].position: חייב להיות בין 0 ל-1');
      if(!(o.width>0))errs.push(P+'.'+k+'['+i+'].width: חייב להיות גדול מאפס')}));
    (f.furniture||[]).forEach((o,i)=>{if(!isPt(o.position))errs.push(P+'.furniture['+i+'].position: חסר')});
    (f.markupLines||[]).forEach((o,i)=>{if(!isPt(o.start)||!isPt(o.end))errs.push(P+'.markupLines['+i+']: start/end חסרים')});
    (f.markupPolygons||[]).forEach((o,i)=>{if(!Array.isArray(o.points)||!o.points.every(isPt))errs.push(P+'.markupPolygons['+i+'].points: לא תקין')});
  });
  return errs;
}

/* ============ snapping ============ */
// wall face lines (both sides); at a connected end the face runs on so it meets the neighbour's face
function wallFaces(){
  const out=[];
  for(const w of walls()){const G=wg(w),cs=isConnected(w,w.start),ce=isConnected(w,w.end),es=cs?G.t/2+15:0,ee=ce?G.t/2+15:0;
    for(const sd of [1,-1]){const hx=G.nx*G.t/2*sd,hy=G.ny*G.t/2*sd;
      out.push({a:{x:w.start.x-G.ux*es+hx,y:w.start.y-G.uy*es+hy},b:{x:w.end.x+G.ux*ee+hx,y:w.end.y+G.uy*ee+hy},w,aReal:!cs,bReal:!ce})}}
  return out;
}
function snap(raw,from,opt){
  opt=opt||{};
  const tol=(opt.touch?26:14)/view.s,markup=!!opt.markup;
  const ex=opt.exclude,exW=opt.excludeWalls||new Set();
  const W=walls();
  const res=(p,kind,extra)=>Object.assign({p:{x:r2(p.x),y:r2(p.y)},kind},extra||{});
  let segs=[],pts=[];
  if(settings.snap){
    if(markup){
      segs=wallFaces().filter(f=>!exW.has(f.w));
      const nearSegs=segs.filter(f=>dist(closestOnSeg(raw,f.a,f.b),raw)<tol*2);
      for(let i=0;i<nearSegs.length;i++){const s=nearSegs[i];if(s.aReal)pts.push(s.a);if(s.bReal)pts.push(s.b);
        for(let j=i+1;j<nearSegs.length;j++){if(nearSegs[j].w===s.w)continue;const q=segInter(s.a,s.b,nearSegs[j].a,nearSegs[j].b);if(q)pts.push(q)}}
      for(const l of lines()){pts.push(l.start,l.end);segs.push({a:l.start,b:l.end})}
      for(const p of polys()){const v=p.points||[];for(let i=0;i<v.length;i++){pts.push(v[i]);segs.push({a:v[i],b:v[(i+1)%v.length]})}}
    }else segs=W.filter(w=>!exW.has(w)).map(w=>({a:w.start,b:w.end,w}));
    for(const w of W)pts.push(w.start,w.end);
    if(chain){pts.push(chain.first);if(chain.points)pts.push(...chain.points)}
    let best=null,bd=tol;
    for(const c of pts){if(ex&&near(c,ex,0.01))continue;const d=dist(c,raw);if(d<bd){bd=d;best=c}}
    if(best)return res(best,'end');
  }
  let p={x:raw.x,y:raw.y},locked=null;
  if(from&&settings.snap){
    const dx=p.x-from.x,dy=p.y-from.y,L=Math.hypot(dx,dy);
    if(L>0){
      const a=Math.atan2(dy,dx)*180/Math.PI;
      const m=Math.round(a/45)*45, lim=(m%90===0)?7:4;
      if(Math.abs(a-m)<lim){
        const rad=m*Math.PI/180;let ux=Math.cos(rad),uy=Math.sin(rad);
        if(m%90===0){ux=Math.round(ux);uy=Math.round(uy)}
        const lp=dx*ux+dy*uy;p={x:from.x+ux*lp,y:from.y+uy*lp};locked={x:ux,y:uy,axis:m%90===0}
      }
    }
  }
  if(settings.snap){
    let hit=null,hd=tol;
    for(const s of segs){
      if(locked){
        const v={x:s.b.x-s.a.x,y:s.b.y-s.a.y},den=cross(locked,v);if(Math.abs(den)<1e-9)continue;
        const A={x:s.a.x-from.x,y:s.a.y-from.y};const t=cross(A,locked)/den;if(t<0||t>1)continue;
        const q={x:s.a.x+v.x*t,y:s.a.y+v.y*t};const d=dist(q,p);if(d<hd){hd=d;hit=q}
      }else{const q=closestOnSeg(p,s.a,s.b);const d=dist(q,p);if(d<hd){hd=d;hit=q}}
    }
    if(hit)return res(hit,'onwall');
    let ax=null,ay=null,bx=tol,by=tol;
    for(const c of pts){if(ex&&near(c,ex,0.01))continue;
      const ddx=Math.abs(c.x-p.x),ddy=Math.abs(c.y-p.y);if(ddx<bx){bx=ddx;ax=c}if(ddy<by){by=ddy;ay=c}}
    if(locked&&locked.axis){
      if(locked.y===0&&ax){p.x=ax.x;return res(p,'align',{align:ax})}
      if(locked.x===0&&ay){p.y=ay.y;return res(p,'align',{align:ay})}
    }else if(!from&&(ax||ay)){
      if(ax)p.x=ax.x;else if(settings.round5)p.x=Math.round(p.x/5)*5;
      if(ay)p.y=ay.y;else if(settings.round5)p.y=Math.round(p.y/5)*5;
      return res(p,'align',{align:ax||ay})
    }
  }
  if(settings.round5){
    if(from){const dx=p.x-from.x,dy=p.y-from.y,L=Math.hypot(dx,dy);
      if(L>0){const Lr=Math.round(L/5)*5;p={x:from.x+dx/L*Lr,y:from.y+dy/L*Lr}}}
    else p={x:Math.round(p.x/5)*5,y:Math.round(p.y/5)*5};
  }
  return res(p,locked?'ortho':'free');
}

/* ============ geometry edit engine ============ */
// A geometry snapshot lets a drag restore the original state and re-apply on every move.
function beginGeom(){
  return {walls:walls().map(w=>({w,s:{x:w.start.x,y:w.start.y},e:{x:w.end.x,y:w.end.y}})),
    opens:openings().map(x=>({o:x.o,pos:x.o.position})),
    furn:furn().map(f=>({f,x:f.position.x,y:f.position.y})),
    lines:lines().map(l=>({l,s:{x:l.start.x,y:l.start.y},e:{x:l.end.x,y:l.end.y}})),
    polys:polys().map(p=>({p,pts:(p.points||[]).map(v=>({x:v.x,y:v.y}))}))};
}
const setPt=(t,p)=>{if(t.x!==p.x)t.x=p.x;if(t.y!==p.y)t.y=p.y};
function restoreGeom(g){
  for(const e of g.walls){setPt(e.w.start,e.s);setPt(e.w.end,e.e)}
  for(const e of g.opens)if(e.o.position!==e.pos)e.o.position=e.pos;
  for(const e of g.furn)setPt(e.f.position,e);
  for(const e of g.lines){setPt(e.l.start,e.s);setPt(e.l.end,e.e)}
  for(const e of g.polys)e.pts.forEach((v,i)=>{if(e.p.points[i])setPt(e.p.points[i],v)});
}
function setEnd(e,k,p){setPt(k==='s'?e.w.start:e.w.end,{x:r2(p.x),y:r2(p.y)})}
// move every wall end that sits on q (original coords) to np
function movePoint(g,q,np){for(const e of g.walls){if(near(e.s,q,0.5))setEnd(e,'s',np);if(near(e.e,q,0.5))setEnd(e,'e',np)}}
// wall ends that sit on the interior of wall e (T-junctions) follow e by d
function followT(g,e,d,skip){
  for(const f of g.walls){if(f===e||(skip&&skip.has(f)))continue;
    for(const k of ['s','e']){const o=f[k];if(near(o,e.s,1)||near(o,e.e,1))continue;
      const q=closestOnSeg(o,e.s,e.e);if(dist(q,o)<=1&&q.t>0&&q.t<1)setEnd(f,k,add(o,d))}}
}
// Stretch: move point q by d. Walls parallel to d stretch; other walls translate and pass d on to their far end.
function stretch(g,seeds){
  const visited=[],queue=seeds.slice(),translated=new Set();
  while(queue.length){
    const {q,d}=queue.shift();if(visited.some(v=>near(v,q,0.5)))continue;visited.push(q);
    const dl=Math.hypot(d.x,d.y);if(dl<1e-9)continue;
    for(const e of g.walls)for(const k of ['s','e']){
      const o=e[k];if(!near(o,q,0.5))continue;
      const other=k==='s'?e.e:e.s,v={x:other.x-o.x,y:other.y-o.y},vl=Math.hypot(v.x,v.y)||1;
      if(Math.abs(cross(v,d))/(vl*dl)<0.02||translated.has(e)){setEnd(e,k,add(o,d));continue}
      translated.add(e);setEnd(e,k,add(o,d));setEnd(e,k==='s'?'e':'s',add(other,d));
      followT(g,e,d);queue.push({q:other,d});
    }
  }
}
// Openings on the edited (primary) wall keep their distance from the wall start.
// A neighbour stretched only at its start keeps its openings where they are (distance from its end).
function reflow(g,primary){

    return inR(X,Y,X+z.w,Y+k.cd)||inR(X,Y,X+k.cd,Y+k.L)||inR(X+z.w-k.cd,Y,X+z.w,Y+k.R)}

function handlesOf(el,kind){

  if(kind==='polygon')return(el.points||[]).map((p,i)=>({p,key:i,small:true,color:shade(el.color||'#1e88e5')}));
  if(kind==='furniture'&&catKey(el)==='kitchen_u'){const k=kParams(el),F=furnFrame(el),X=-k.W/2,Y=-k.D/2,col='#00897b';

      {p:F.toWorld(X,Y+k.cd/2),key:'kWl',color:col},{p:F.toWorld(X+k.W,Y+k.cd/2),key:'kWr',color:col}]}

/* ============ hit testing ============ */
function hitTest(wp,touch){
  const tol=(touch?22:12)/view.s;
  const s=getSel();
  if(s)for(const h of handlesOf(s,sel.kind))if(dist(h.p,wp)<=(touch?24:14)/view.s)return{kind:'handle',owner:sel.kind,el:s,key:h.key};
  let best=null,bd=Infinity;
  for(const x of openings()){const w=wallById(x.o.wallId);if(!w)continue;const G=wg(w);
    const rx=wp.x-w.start.x,ry=wp.y-w.start.y,al=rx*G.ux+ry*G.uy,pe=Math.abs(rx*G.nx+ry*G.ny),cd=x.o.position*G.L;
    if(pe<=G.t/2+tol&&Math.abs(al-cd)<=x.o.width/2+tol*0.3){const sc=pe+Math.abs(al-cd)*0.1;if(sc<bd){bd=sc;best={kind:x.kind,el:x.o}}}}
  if(best)return best;
  const ls=lines();let lb=null,ld=tol;for(const l of ls){const d=dist(closestOnSeg(wp,l.start,l.end),wp)-(l.width||2)/2/view.s;if(d<ld){ld=d;lb=l}}
  if(lb)return{kind:'line',el:lb};
  let wb=null,wd=Infinity;
  for(const w of walls()){const q=closestOnSeg(wp,w.start,w.end),d=dist(q,wp);if(d<wd){wd=d;wb=w}}
  if(wb&&wd<=(wb.thickness||15)/2)return{kind:'wall',el:wb};
  const fs=furn();for(let i=fs.length-1;i>=0;i--)if(furnContains(fs[i],wp,tol*0.3))return{kind:'furniture',el:fs[i]};
  if(wb&&wd<=(wb.thickness||15)/2+tol)return{kind:'wall',el:wb};
  const ps=polys();for(let i=ps.length-1;i>=0;i--)if(ps[i].points&&ps[i].points.length>2&&inPoly(wp,ps[i].points))return{kind:'polygon',el:ps[i]};
  return null;
}

/* ============ pointer input ============ */
const pointers=new Map();let gest=null,lastPinch=0,penSeen=false;

const copyChain=c=>c?Object.assign({},c,c.points?{points:c.points.slice()}:{}):null;
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0&&e.button!==1)return;

  if(e.pointerType==='pen'&&settings.fingerDraws&&!penSeen){penSeen=true;settings.fingerDraws=false;updateUI();saveNow();toast('זוהה עט: העט משרטט, האצבע מזיזה ומגדילה')}
  pointers.set(e.pointerId,{p:posOf(e),type:e.pointerType});

});
cv.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)){hoverMove(e);return}

  if(gest&&gest.id===e.pointerId)singleMove(e);

const endPtr=(e,cancel)=>{
  if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);
  if(gest&&gest.type==='pinch'){if(pointers.size<2)gest={type:'dead'};if(!pointers.size)gest=null;return}
  if(gest&&gest.type==='dead'){if(!pointers.size)gest=null;return}
  if(gest&&gest.id===e.pointerId){singleEnd(e,cancel);gest=null}

cv.addEventListener('pointerup',e=>endPtr(e,false));
cv.addEventListener('pointercancel',e=>endPtr(e,true));
cv.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'&&!pointers.size&&DRAW_TOOLS.has(tool)){preview=null;render()}});
cv.addEventListener('wheel',e=>{e.preventDefault();closeDimEdit();rect=cv.getBoundingClientRect();const p=posOf(e);

function startPinch(){
  if(gest&&gest.pre&&gest.changed){restore(gest.pre)}
  if(gest&&gest.chainBefore!==undefined)chain=gest.chainBefore;
  const [a,b]=[...pointers.values()].map(v=>v.p);
  gest={type:'pinch',d0:Math.max(1,dist(a,b)),m0:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v0:{...view}};
  preview=null;setHud('');render();
}
function doPinch(){
  const [a,b]=[...pointers.values()].map(v=>v.p);const g=gest;
  const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},k=dist(a,b)/g.d0;const ns=clamp(g.v0.s*k,0.02,40);
  const wx=(g.m0.x-g.v0.ox)/g.v0.s,wy=(g.m0.y-g.v0.oy)/g.v0.s;view.s=ns;view.ox=m.x-wx*ns;view.oy=m.y-wy*ns;lastPinch=Date.now();render();

function startSingle(e){

    const td=tempDims.find(t=>dist(t.L,p)<(touch?26:18));
    if(td){gest.target='dim';gest.dim=td;return}
    const h=hitTest(wp,touch);gest.hit=h;
    if(h&&(h.kind==='door'||h.kind==='window')){gest.target='open';const w=wallById(h.el.wallId),G=wg(w);

function singleMove(e){

    let edge=((wp.x-w.start.x)*G.ux+(wp.y-w.start.y)*G.uy)-g.grab-el.width/2;if(settings.round5)edge=Math.round(edge/5)*5;

function dragHandle(g,h,wp){

    const s=snap(wp,other,{touch:g.touch,markup:true,exclude:o});setPt(h.key==='start'?el.start:el.end,s.p);setHud('אורך: '+fmt(dist(el.start,el.end))+' ס"מ')}

    if(h.key==='kR'){const R=clamp(r5(lp.y-Y0),o.cd,2000);setKitchen(el,o,o.W,o.L,R,'none');setHud('רגל ימין: '+fmt(R))}

function singleEnd(e,cancel){

function tap(g){

    if(!chain){startChain(s.p);preview=g.touch?null:s;render();toast(tool==='area'?'הקש על הפינות; הקשה על הנקודה הראשונה סוגרת':'הקש על נקודת הסיום, או גרור');updateToolOpts();return}

const swatches=(cur,attr)=>COLORS.map(c=>'<button class="sw'+(c===cur?' on':'')+'" style="background:'+c+'" '+attr+'="'+c+'" aria-label="צבע"></button>').join('');

function applyField(k,raw){
  const el=getSel();if(!el)return;
  if(k==='wallType'){if(raw==='__other'){const v=prompt('שם סוג הקיר (כפי שמופיע ברוויט):',el.wallType||'');if(v==null){refreshPanel();return}raw=v.trim()}
    commit(()=>{if(raw){el.wallType=raw;const t=WALL_TYPES.find(w=>w.name===raw);if(t)el.thickness=t.t}else delete el.wallType});return}
  if(k==='type'){commit(()=>{el.type=raw});return}
  if(k==='pname'){commit(()=>{if(el.name===raw.trim())return false;el.name=raw.trim()});return}
  const v=parseNum(raw);
  if(!isFinite(v)){refreshPanel();return}
  const bad=()=>{refreshPanel();return};
  if(sel.kind==='wall'){
    if(k==='len'){if(v<1){toast('אורך מינימלי 1 ס"מ');return bad()}commit(()=>setWallLength(el,v,settings.fixedEnd))}
    else if(k==='thickness'){if(v<=0)return bad();commit(()=>{el.thickness=v})}
    else if(k==='height'){if(v<0)return bad();commit(()=>{el.height=v;if('startHeight' in el)el.startHeight=v;if('endHeight' in el)el.endHeight=v})}
  }else if(sel.kind==='door'||sel.kind==='window'){const w=wallById(el.wallId);
    if(k==='width'){if(v<=0)return bad();const edge=opDist(el,w);commit(()=>{el.width=v;setOpDist(el,w,edge)})}
    else if(k==='dist'){commit(()=>setOpDist(el,w,v))}
    else if(k==='height'){if(v<=0)return bad();commit(()=>{el.height=v})}
    else if(k==='sillHeight'){if(v<0)return bad();commit(()=>{el.sillHeight=v})}
  }else if(sel.kind==='furniture'){
    const sx=Math.abs((el.scale&&el.scale.x)||1),sy=Math.abs((el.scale&&el.scale.y)||1);
    if(catKey(el)==='kitchen_u'){const kp=kParams(el),o=Object.assign(kp,{frame:furnFrame(el)});
      if(k==='fw'){if(v<2*kp.cd+20)return bad();commit(()=>setKitchen(el,o,v,kp.L,kp.R,'left'));return}
      if(k==='kL'||k==='kR'){if(v<kp.cd)return bad();commit(()=>setKitchen(el,o,kp.W,k==='kL'?v:kp.L,k==='kR'?v:kp.R,'none'));return}
      if(k==='kcd'){if(v<30||v*2+20>kp.W)return bad();commit(()=>{el.counterDepth=v;if(kp.L<v)el.leftDepth=v;if(kp.R<v)el.rightDepth=v;el.depth=Math.max(el.leftDepth,el.rightDepth)});return}
      if(k==='ksink'){commit(()=>{el.sinkAt=clamp(v,30,kp.W-30)});return}
      if(k==='kcookAt'){commit(()=>{el.cooktopAt=v});return}
    }
    if(k==='fw'){if(v<=0)return bad();commit(()=>{el.width=r2(v/sx)})}
    else if(k==='fd'){if(v<=0)return bad();commit(()=>{el.depth=r2(v/sy)})}
    else if(k==='rotation'){commit(()=>{el.rotation=((v%360)+360)%360})}
  }else if(sel.kind==='line'){
    if(k==='llen'){if(v<1)return bad();const L=dist(el.start,el.end)||1,ux=(el.end.x-el.start.x)/L,uy=(el.end.y-el.start.y)/L;
      commit(()=>setPt(el.end,{x:r2(el.start.x+ux*v),y:r2(el.start.y+uy*v)}))}
  }
}
function applySeg(g,v){
  if(g==='fixed'){settings.fixedEnd=v;saveNow();refreshPanel();return}
  if(g==='dimmode'){settings.dimMode=v;saveNow();refreshPanel();render();return}
  if(g==='join'){setJoin(v==='1');return}
  const el=getSel();if(!el)return;
  if(g==='swing')commit(()=>{if((el.swingDirection||'left')===v)return false;el.swingDirection=v});
  if(g==='flip')commit(()=>{const f=v==='1';if(!!el.flipSide===f)return false;el.flipSide=f});
  if(g==='ns')commit(()=>{if((el.nightstands||'none')===v)return false;el.nightstands=v});
  if(g==='kcook')commit(()=>{el.cooktopLeg=v});
  if(g==='lcolor'||g==='pcolor')commit(()=>{if(el.color===v)return false;el.color=v});
  if(g==='lw')commit(()=>{el.width=+v});
}
function panelAction(a){
  if(a==='mini'){settings.panelMini=!settings.panelMini;saveNow();refreshPanel();return}
  const el=getSel();if(a==='close'){sel=null;refreshPanel();render();return}if(!el)return;const k=sel.kind;
  if(a==='del'){commit(()=>{const f=floor();if(k==='wall'){['doors','windows'].forEach(x=>{if(Array.isArray(f[x]))f[x]=f[x].filter(o=>String(o.wallId)!==String(el.id))})}
      f[ARR[k]]=f[ARR[k]].filter(e=>e!==el)});sel=null;refreshPanel();render();return}
  if(a==='addDoor'||a==='addWin'){addOpening(a==='addDoor'?'door':'window',el,wg(el).L/2);return}
  if(a==='flip'){commit(()=>{const s={x:el.start.x,y:el.start.y};el.start.x=el.end.x;el.start.y=el.end.y;el.end.x=s.x;el.end.y=s.y;
      for(const x of openings())if(String(x.o.wallId)===String(el.id)){x.o.position=r8(1-x.o.position);if(x.kind==='door'){x.o.flipSide=!x.o.flipSide;x.o.swingDirection=(x.o.swingDirection||'left')==='left'?'right':'left'}}});return}
  if(a==='flipBoth'){commit(()=>{el.flipSide=!el.flipSide;el.swingDirection=(el.swingDirection||'left')==='left'?'right':'left'});return}
  if(a==='rotL'||a==='rotR'){commit(()=>{el.rotation=(((el.rotation||0)+(a==='rotR'?90:-90))%360+360)%360});return}
  if(a==='mirror'){commit(()=>{if(!el.scale)el.scale={x:1,y:1,z:1};el.scale.x=-(el.scale.x||1)});return}
  if(a==='dup'){let id;commit(()=>{const c=JSON.parse(JSON.stringify(el));delete c.revitId;delete c.revitUniqueId;id=newId('f-');c.id=id;c.position={x:r2(el.position.x+30),y:r2(el.position.y+30)};ensureArr('furniture').push(c)});sel={kind:'furniture',id};refreshPanel();render()}
}

// PNG: draw at k× pixel density so text and line widths stay legible on a ~3000 px image
function renderPNG(){
  const b=planBounds()||{x0:0,y0:0,x1:500,y1:500};const pad=60,bw=b.x1-b.x0,bh=b.y1-b.y0;
  const s=clamp(3000/Math.max(bw,bh),0.5,4),k=2.5;const Wc=Math.ceil(bw*s+2*pad),Hc=Math.ceil(bh*s+2*pad);
  const c=document.createElement('canvas');c.width=Wc;c.height=Hc;const x=c.getContext('2d');
  const sv=sel;sel=null;draw(x,{s:s/k,ox:(pad-b.x0*s)/k,oy:(pad-b.y0*s)/k},Wc/k,Hc/k,k,true);sel=sv;return c;
}

  const c=renderPNG();
  c.toBlob(async blob=>{const name=fileBase()+'.png';
    try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})&&'ontouchend' in document){await navigator.share({files:[f],title:project.name});return}}catch(e){if(e&&e.name==='AbortError')return}
    download(blob,name)},'image/png');
}

/* ============ furniture palette ============ */
function buildFurnGrid(){
  const g=$('#furnGrid');
  for(const it of PALETTE){const cat=CAT[it.key],b=document.createElement('button'),k=document.createElement('canvas');k.width=128;k.height=128;
    const x=k.getContext('2d'),stub=Object.assign({width:it.w,depth:it.d},it.extra||{});
    const ext=(it.extra&&it.extra.nightstands&&it.extra.nightstands!=='none')?110:0;
    const sc=100/Math.max(it.w,it.d+ext,1);x.setTransform(sc,0,0,sc,64,64);x.lineWidth=1.6/sc;x.strokeStyle='#555';x.fillStyle='#fafafa';
    furnSymbol(x,cat.sym,it.w,it.d,stub,sc);
    b.appendChild(k);const sp=document.createElement('span');sp.textContent=it.he;b.appendChild(sp);
    const sz=document.createElement('span');sz.className='hint';sz.style.margin='0';sz.style.direction='ltr';sz.textContent=it.w+'×'+it.d;b.appendChild(sz);
    b.onclick=()=>{pendingFurn=it;closeDlg('dFurn');if(tool!=='furniture'){tool='furniture';sel=null;refreshPanel();document.querySelectorAll('#tools [data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool==='furniture'))}toast('הקש על התוכנית למיקום: '+it.he)};
    g.appendChild(b)}
}

/* ============ misc UI ============ */
function setHud(t){if(t===hudText)return;hudText=t;const h=$('#hud');h.textContent=t;h.classList.toggle('show',!!t)}
let toastT=null;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200)}
function updateUI(){
  $('#bUndo').disabled=!undoStack.length;$('#bRedo').disabled=!redoStack.length;
  $('#projName').textContent=project.name||'ללא שם';
  $('#tJoin').classList.toggle('on',settings.joinWalls);$('#tJoinL').textContent=settings.joinWalls?'מחובר':'מנותק';
  $('#tSnap').classList.toggle('on',settings.snap);$('#tRound').classList.toggle('on',settings.round5);$('#tFinger').classList.toggle('on',settings.fingerDraws);
  const fs=$('#floorSel');if(project.floors.length>1){fs.hidden=false;fs.innerHTML=project.floors.map(f=>'<option value="'+esc(f.id)+'"'+(f===floor()?' selected':'')+'>'+esc(f.name||f.id)+'</option>').join('')}else fs.hidden=true;
}
$('#floorSel').onchange=e=>{curFloorId=e.target.value;sel=null;chain=null;refreshPanel();saveNow();fit()};
document.querySelectorAll('#tools [data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('#tSnap').onclick=()=>{settings.snap=!settings.snap;saveNow();updateUI();toast(settings.snap?'הצמדה פעילה: קצוות, קירות, אופקי/אנכי':'הצמדה כבויה')};
function setJoin(on){settings.joinWalls=on;saveNow();updateUI();refreshPanel();toast(on?'מחובר: קירות בפינה זזים יחד':'מנותק: רק הקיר הנבחר זז')}
$('#tJoin').onclick=()=>setJoin(!settings.joinWalls);
$('#tRound').onclick=()=>{settings.round5=!settings.round5;saveNow();updateUI();toast(settings.round5?'עיגול ל-5 ס"מ פעיל':'עיגול ל-5 ס"מ כבוי')};
$('#tFinger').onclick=()=>{settings.fingerDraws=!settings.fingerDraws;penSeen=true;saveNow();updateUI();toast(settings.fingerDraws?'האצבע משרטטת':'רק העט משרטט; האצבע מזיזה')};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bFit').onclick=fit;
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  const m=e.ctrlKey||e.metaKey;
  if(m&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(m&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(e.key==='Escape'){if(chain)endChain();else{sel=null;refreshPanel();render()}}
  else if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();panelAction('del')}
  else if(e.key==='Enter'&&chain)endChain();
});
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});

/* ============ boot ============ */
function boot(){
  try{const s=JSON.parse(localStorage.getItem(LS_SETTINGS)||'null');if(s){Object.assign(settings,s.settings||{});if(s.view)view=s.view;curFloorId=s.curFloorId||null;penSeen=!settings.fingerDraws}}catch(e){}
  try{const t=localStorage.getItem(LS_PROJECT);if(t){const p=JSON.parse(t);if(!validate(p).length)project=p}}catch(e){}
  const fresh=!project;if(!project)project=blankProject();
  buildFurnGrid();updateUI();setTool('select');
  new ResizeObserver(resize).observe(stage);resize();
  if(fresh||!view||!(view.s>0))fit();
}
// test / automation hook (the Revit bot or a test page can drive the editor through this)
window.PlanEditor={
  importText,exportText,getProject:()=>project,
  setWallLength:(id,L,fixed)=>{const w=wallById(id);if(!w)throw new Error('no wall '+id);commit(()=>setWallLength(w,L,fixed||'start'))},
  opDist:id=>{const o=openings().find(x=>x.o.id===id);return o?opDist(o.o,wallById(o.o.wallId)):null},
  select:(kind,id)=>{sel={kind,id};refreshPanel();render()},
  tempDims:()=>{draw(ctx,view,cw,ch,dpr,false);return tempDims.map(t=>({value:t.value,x:t.L.x,y:t.L.y}))},
  applyTempDim:(i,v)=>{draw(ctx,view,cw,ch,dpr,false);const td=tempDims[i];if(!td)throw new Error('no dim '+i);commit(()=>td.apply(v))},
  view:()=>({...view}),undo,redo,fit,renderPNG
};
boot();
})();
</script>
