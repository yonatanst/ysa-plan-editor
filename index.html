<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תוכניות">
<meta name="theme-color" content="#f4f2ee">
<title>עורך תוכניות קומה</title>
<style>
:root{
  --bg:#f4f2ee;--panel:#ffffff;--ink:#1f2328;--muted:#6b7078;--line:#dcd8d0;
  --accent:#1565c0;--accent-weak:#e3eefb;--danger:#c62828;--ok:#2e7d32;--dim:#00897b;
  --btn:52px;--radius:14px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew","Segoe UI",Arial,sans-serif;font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:6px;padding:calc(6px + var(--st)) calc(8px + var(--sr)) 6px calc(8px + var(--sl));
  background:var(--panel);border-bottom:1px solid var(--line);min-height:calc(60px + var(--st))}
#title{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#projName{background:none;border:0;font-weight:600;font-size:17px;padding:8px 6px;border-radius:10px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
#floorSel{height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 8px;max-width:150px}
.ib{width:var(--btn);height:var(--btn);min-width:var(--btn);border-radius:var(--radius);border:0;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:0}
.ib:active{background:#ebe8e2}
.ib:disabled{opacity:.3}
.ib svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#fff}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tools{display:flex;gap:2px;padding:6px calc(6px + var(--sr)) calc(6px + var(--sb)) calc(6px + var(--sl));background:var(--panel);
  border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;order:2}
#tools::-webkit-scrollbar{display:none}
.tb{min-width:58px;height:60px;border-radius:var(--radius);border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink);padding:0 4px;flex:0 0 auto}
.tb svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.tb.tog.on{background:#e8f3ea;color:var(--ok)}
.tb.tog.lock.on{background:#fff3e0;color:#a75a00}
.tb:disabled{opacity:.3}
#panel.locked .fields,#panel.locked .acts{opacity:.45;pointer-events:none}
.tb .big{font-size:20px;font-weight:700;line-height:26px}
.sep{width:1px;background:var(--line);margin:8px 4px;flex:0 0 1px}
#toolopts{position:absolute;top:10px;right:10px;left:10px;display:none;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:3}
#toolopts.show{display:flex}
#toolopts>*{pointer-events:auto}
.chip{height:46px;border-radius:23px;border:1px solid var(--line);background:#fff;padding:0 12px;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:15px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip select,.chip input{border:0;background:transparent;height:40px;font-size:15px;outline:none}
.chip input{width:58px;text-align:center}
.chip.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.chip .seg button{height:34px;padding:0 10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;flex:0 0 auto}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
#hud{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:rgba(31,35,40,.88);color:#fff;border-radius:14px;
  padding:8px 16px;font-size:20px;font-weight:600;display:none;z-index:4;pointer-events:none;white-space:nowrap;direction:rtl}
#hud.show{display:block}
#toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(31,35,40,.92);color:#fff;border-radius:12px;
  padding:10px 16px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
#dimEdit{position:absolute;display:none;width:100px;height:46px;transform:translate(-50%,-50%);font-size:19px;font-weight:600;text-align:center;
  border:2px solid var(--dim);border-radius:12px;z-index:7;direction:ltr;background:#fff;color:var(--dim);-webkit-user-select:text;user-select:text;
  box-shadow:0 4px 16px rgba(0,0,0,.18);outline:none}
/* panel: compact bottom strip on phones, floating card on wide screens */
#panel{position:absolute;left:0;right:0;bottom:0;max-height:42%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.12);padding:6px 10px 10px;z-index:5;display:none;-webkit-overflow-scrolling:touch}
#panel.show{display:block}
.ph{display:flex;align-items:center;gap:6px;margin-bottom:4px;min-height:40px}
.ph h3{margin:0;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .id{font-size:11px;color:var(--muted);direction:ltr;white-space:nowrap}
.ph .ib{width:40px;height:40px;min-width:40px}
.ph .ib svg{width:22px;height:22px}
.badge{font-size:11px;background:#fff3e0;color:#a75a00;border-radius:8px;padding:2px 7px;direction:ltr;white-space:nowrap}
.fields{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:flex-end}
.fields::-webkit-scrollbar,.acts::-webkit-scrollbar{display:none}
.field{flex:0 0 auto;display:flex;flex-direction:column;gap:3px}
.field>label{font-size:12px;color:var(--muted);white-space:nowrap}
.num{height:44px;width:82px;border:1px solid var(--line);border-radius:11px;padding:0 6px;font-size:17px;text-align:center;
  direction:ltr;background:#fff;-webkit-user-select:text;user-select:text}
.txt{height:44px;width:150px;border:1px solid var(--line);border-radius:11px;padding:0 10px;font-size:16px;background:#fff;-webkit-user-select:text;user-select:text}
.num:focus,.txt:focus{outline:2px solid var(--accent);border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:0 0 auto}
.seg button{height:44px;border:0;background:#fff;padding:0 11px;font-size:14px;border-inline-start:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--accent);color:#fff}
.swrow{display:flex;gap:6px;height:44px;align-items:center}
.sel{height:44px;border:1px solid var(--line);border-radius:11px;padding:0 8px;background:#fff;font-size:15px;min-width:120px}
.info{height:44px;display:flex;align-items:center;font-size:18px;font-weight:600;padding:0 4px;direction:rtl;white-space:nowrap}
.acts{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.btn{height:50px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:16px;display:inline-flex;
  align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap}
.btn.sm{height:42px;padding:0 12px;font-size:15px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger);border-color:#f0c9c9}
.btn:active{filter:brightness(.94)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
#panel .hint{display:none}
#panel.mini .fields,#panel.mini .acts,#panel.mini .hint{display:none!important}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg.show{display:flex}
.dlg .box{background:#fff;border-radius:18px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h2{margin:0 0 10px;font-size:20px}
.dlg textarea{width:100%;height:42vh;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;
  direction:ltr;text-align:left;-webkit-user-select:text;user-select:text;resize:vertical}
.dlg .acts{flex-wrap:wrap;margin-top:12px}
.err{color:var(--danger);font-size:14px;margin-top:8px;white-space:pre-wrap;direction:rtl}
#menu .box{width:min(380px,100%)}
#menu .mi{display:flex;width:100%;height:56px;align-items:center;gap:12px;border:0;background:none;font-size:17px;padding:0 8px;border-radius:12px}
#menu .mi:active{background:#f1efea}
#menu .mi svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bSave{position:relative}
#saveDot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:#c25e00;display:none}
#bSave.dirty #saveDot{display:block}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.lrow .nm{flex:1;min-width:0}
.lrow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm span{font-size:12px;color:var(--muted)}
.lrow.cur{background:var(--accent-weak);border-radius:10px}
#furnGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
#furnGrid button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;min-height:108px}
#furnGrid button:active{background:var(--accent-weak)}
#furnGrid canvas{width:64px;height:64px}
@media (min-width:860px){
  #main{flex-direction:row}
  #tools{order:0;flex-direction:column;border-top:0;border-inline-end:1px solid var(--line);padding:8px 6px calc(8px + var(--sb));overflow-y:auto;overflow-x:hidden}
  .tb{min-width:72px;height:64px}
  .sep{width:auto;height:1px;margin:4px 8px;flex:0 0 1px}
  #panel{left:12px;right:auto;bottom:auto;top:12px;width:360px;max-height:calc(100% - 24px);border-radius:18px;border:1px solid var(--line);
    box-shadow:0 8px 30px rgba(0,0,0,.14);padding:10px 14px 14px}
  .fields{flex-wrap:wrap;overflow:visible;gap:10px}
  .acts{flex-wrap:wrap}
  #panel .hint{display:block}
  #toolopts{left:auto}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="ib" id="bMenu" aria-label="תפריט"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="ib" id="bSave" aria-label="שמור"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span id="saveDot"></span></button>
    <div id="title"><button id="projName" title="שינוי שם"></button><select id="floorSel" aria-label="קומה" hidden></select></div>
    <button class="ib" id="bFit" aria-label="התאם למסך"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="bRedo" aria-label="שחזור"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/></svg></button>
    <button class="ib" id="bUndo" aria-label="ביטול"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12h2" transform="translate(0 -6)"/></svg></button>
  </header>
  <div id="main">
    <nav id="tools">
      <button class="tb" data-tool="select"><svg viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1 3.5 7-2.5 1.2-3.5-7L6 18z"/></svg>בחירה</button>
      <button class="tb" data-tool="wall"><svg viewBox="0 0 24 24"><path d="M3 20V8h8V4h10" stroke-width="3.2"/><circle cx="3" cy="20" r="1.6" fill="currentColor"/><circle cx="21" cy="4" r="1.6" fill="currentColor"/></svg>קיר</button>
      <button class="tb" data-tool="door"><svg viewBox="0 0 24 24"><path d="M2 20h4M18 20h4" stroke-width="3.2"/><path d="M6 20V6"/><path d="M6 6a14 14 0 0 1 12 14"/></svg>דלת</button>
      <button class="tb" data-tool="window"><svg viewBox="0 0 24 24"><path d="M2 12h4M18 12h4" stroke-width="3.2"/><rect x="6" y="9" width="12" height="6"/><path d="M6 12h12"/></svg>חלון</button>
      <button class="tb" data-tool="furniture"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="2"/><path d="M3 11h18M6 8V5h12v3"/></svg>ריהוט</button>
      <button class="tb" data-tool="line"><svg viewBox="0 0 24 24"><path d="M4 19L20 5" stroke="#e53935" stroke-width="2.6"/><circle cx="4" cy="19" r="1.8" fill="currentColor"/><circle cx="20" cy="5" r="1.8" fill="currentColor"/></svg>קו</button>
      <button class="tb" data-tool="area"><svg viewBox="0 0 24 24"><path d="M4 6l11-2 5 9-7 7-9-3z" fill="rgba(30,136,229,.3)" stroke="#1e88e5"/></svg>אזור</button>
      <div class="sep"></div>
      <button class="tb tog" id="tSnap"><svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3z"/><path d="M6 7h4M14 7h4"/></svg>הצמדה</button>
      <button class="tb tog" id="tRound"><span class="big">5</span>עיגול ס"מ</button>
      <button class="tb tog" id="tJoin"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span id="tJoinL">מחובר</span></button>
      <button class="tb tog" id="tOrtho"><svg viewBox="0 0 24 24"><path d="M5 4v15h15" stroke-width="2.6"/><path d="M5 13h6v6"/></svg>אורתוגונלי</button>
      <button class="tb tog lock" id="tLock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="tLockArc" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="tLockL">נעילה</span></button>
      <button class="tb tog" id="tFinger"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5m0-1a1.5 1.5 0 0 1 3 0v2m0-1a1.5 1.5 0 0 1 3 0v4a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.6-1.5L9 15"/></svg>אצבע מציירת</button>
    </nav>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="toolopts"></div>
      <div id="hud"></div>
      <div id="toast"></div>
      <input id="dimEdit" inputmode="decimal" enterkeyhint="done" autocomplete="off">
      <aside id="panel"></aside>
    </div>
  </div>
</div>

<div class="dlg" id="menu"><div class="box">
  <button class="mi" data-act="lib"><svg viewBox="0 0 24 24"><path d="M4 5h6l2 2h8v12H4z"/></svg>התוכניות שלי</button>
  <button class="mi" data-act="import"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>ייבוא JSON</button>
  <button class="mi" data-act="export"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 19h16"/></svg>ייצוא JSON</button>
  <button class="mi" data-act="png"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>ייצוא PNG</button>
  <button class="mi" data-act="rename"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>שינוי שם התוכנית</button>
  <button class="mi" data-act="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>תוכנית חדשה</button>
  <div class="hint" style="padding:6px 8px">פורמט: OpenPlan3D web project JSON · ס"מ · x ימינה, y למטה · נשמר אוטומטית במכשיר</div>
  <div class="acts"><button class="btn" data-close>סגור</button></div>
</div></div>

<div class="dlg" id="dImport"><div class="box">
  <h2>ייבוא JSON</h2>
  <textarea id="impText" placeholder="הדבק כאן JSON של OpenPlan3D" spellcheck="false"></textarea>
  <div class="err" id="impErr"></div>
  <div class="acts">
    <button class="btn primary" id="impGo">ייבא</button>
    <button class="btn" id="impPaste">הדבק מהלוח</button>
    <button class="btn" id="impFileBtn">בחר קובץ…</button>
    <input type="file" id="impFile" accept=".json,application/json,text/plain" hidden>
    <button class="btn" data-close>ביטול</button>
  </div>
</div></div>

<div class="dlg" id="dExport"><div class="box">
  <h2>ייצוא JSON</h2>
  <textarea id="expText" readonly spellcheck="false"></textarea>
  <div class="acts">
    <button class="btn primary" id="expCopy">העתק</button>
    <button class="btn" id="expDown">הורד קובץ</button>
    <button class="btn" id="expShare" hidden>שתף…</button>
    <button class="btn" data-close>סגור</button>
  </div>
</div></div>

<div class="dlg" id="dLib"><div class="box">
  <h2>התוכניות שלי</h2>
  <div id="libList"></div>
  <div class="hint">נשמר במכשיר הזה בלבד. לגיבוי או להעברה למכשיר אחר: "שמור כקובץ".</div>
  <div class="acts">
    <button class="btn primary" id="libSave">שמור</button>
    <button class="btn" id="libSaveAs">שמור עותק בשם…</button>
    <button class="btn" id="libFile">שמור כקובץ</button>
    <button class="btn" data-close>סגור</button>
  </div>
</div></div>

<div class="dlg" id="dFurn"><div class="box">
  <h2>ריהוט</h2>
  <div class="hint">בחר פריט ואז הקש על התוכנית במקום שבו הוא יוצב</div>
  <div id="furnGrid"></div>
  <div class="acts"><button class="btn" data-close>סגור</button></div>
</div></div>

<script>
'use strict';
(function(){
/* ============ constants ============ */
const LS_PROJECT='planEditor.project.v1', LS_SETTINGS='planEditor.settings.v1';
// markupLines / markupPolygons are this editor's own floor keys; OpenPlan3D keeps unknown keys untouched.
const ARR={wall:'walls',door:'doors',window:'windows',furniture:'furniture',line:'markupLines',polygon:'markupPolygons'};
const KIND_HE={wall:'קיר',door:'דלת',window:'חלון',furniture:'ריהוט',line:'קו',polygon:'אזור'};
const DRAW_TOOLS=new Set(['wall','line','area']);
const COLORS=['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#fdd835','#212121'];
// Office wall types, names exactly as in the template YSA_Families_6.7.25 (ספר הדרכה 1.10.23, walls section).
// core = what the plan draws; total = the Revit type width, written to thickness. "+ P" = 2.5 plaster each side.
const WALL_TYPES=[
  ['C 20 + P',20,25,'בטון + טיח (חוץ, בין דירות)'],['B 10 + P',10,15,'בלוק + טיח (פנים)'],['B 15 + P',15,20,'בלוק + טיח'],['B 20 + P',20,25,'בלוק + טיח'],
  ['C 10',10,10,'בטון'],['C 10 + P',10,15,'בטון + טיח'],['C 15',15,15,'בטון'],['C 15 + P',15,20,'בטון + טיח'],['C 20',20,20,'בטון'],
  ['C 20 + P 5',20,27.5,'בטון + טיח 5'],['C 25',25,25,'בטון'],['C 25 + P',25,30,'בטון + טיח'],['C 30 + P',30,35,'בטון + טיח'],

  let best=null,bd=Infinity;
  for(const x of openings()){const w=wallById(x.o.wallId);if(!w)continue;const G=wg(w);
    const rx=wp.x-w.start.x,ry=wp.y-w.start.y,al=rx*G.ux+ry*G.uy,pe=Math.abs(rx*G.nx+ry*G.ny),cd=x.o.position*G.L;

  for(const w of walls()){const q=closestOnSeg(wp,w.start,w.end),d=dist(q,wp);if(d<wd){wd=d;wb=w}}
  if(wb&&wd<=coreT(wb)/2)return{kind:'wall',el:wb};
  const fs=furn();for(let i=fs.length-1;i>=0;i--)if(furnContains(fs[i],wp,tol*0.3))return{kind:'furniture',el:fs[i]};
  if(wb&&wd<=coreT(wb)/2+tol)return{kind:'wall',el:wb};

function refreshPanelValues(){const pn=$('#panel'),el=getSel();if(!el||!pn.classList.contains('show'))return;

function applyField(k,raw){
  const el=getSel();if(!el)return;
  if(k==='wallType'){const t=WALL_TYPES.find(w=>w.name===raw);if(!t){refreshPanel();return}
    commit(()=>{el.wallType=t.name;el.thickness=t.total;reseatOn(el)});return}
  if(k==='fam'||k==='size'){const kind=sel.kind,fm=k==='fam'?famsOf(kind).find(f=>f.fam===raw):famOf(kind,el),w=wallById(el.wallId);if(!fm||!w){refreshPanel();return}
    // a new family keeps the size when it is one of its types, else takes its default
    const size=k==='size'?raw:fm.sizes.includes(revitTypeName(el))?revitTypeName(el):fm.sizes[0];
    commit(()=>{setOpenType(kind,el,fm,size,w);const s=kind==='door'?'door':'win';settings[s+'Fam']=fm.fam;settings[s+'Size']=size;saveNow()});return}
  if(k==='pname'){commit(()=>{if(el.name===raw.trim())return false;el.name=raw.trim()});return}
  const v=parseNum(raw);
  if(!isFinite(v)){refreshPanel();return}
  const bad=()=>{refreshPanel();return};
  if(sel.kind==='wall'){
    if(k==='len'){if(v<1){toast('אורך מינימלי 1 ס"מ');return bad()}commit(()=>setWallLength(el,v,settings.fixedEnd))}
    else if(k==='height'){if(v<0)return bad();commit(()=>{el.height=v;if('startHeight' in el)el.startHeight=v;if('endHeight' in el)el.endHeight=v})}
  }else if(sel.kind==='door'||sel.kind==='window'){const w=wallById(el.wallId);
    if(k==='width'){if(v<=0)return bad();const edge=opDist(el,w);commit(()=>{el.width=v;setOpDist(el,w,edge);syncOpenType(sel.kind,el)})}
    else if(k==='height'){if(v<=0)return bad();commit(()=>{el.height=v;syncOpenType(sel.kind,el)})}
    else if(k==='sillHeight'){if(v<0)return bad();commit(()=>{el.sillHeight=v})}
  }else if(sel.kind==='furniture'){
    const sx=Math.abs((el.scale&&el.scale.x)||1),sy=Math.abs((el.scale&&el.scale.y)||1);
    if(catKey(el)==='kitchen_u'){const kp=kParams(el),o=Object.assign(kp,{frame:furnFrame(el)});
      if(k==='fw'){if(v<2*kp.cd+20)return bad();commit(()=>setKitchen(el,o,v,kp.L,kp.R,'left'));return}
      if(k==='kL'||k==='kR'){if(v<kp.cd)return bad();commit(()=>setKitchen(el,o,kp.W,k==='kL'?v:kp.L,k==='kR'?v:kp.R,'none'));return}
      if(k==='kcd'){if(v<30||v*2+20>kp.W)return bad();commit(()=>{el.counterDepth=v;if(kp.L<v)el.leftDepth=v;if(kp.R<v)el.rightDepth=v;el.depth=Math.max(el.leftDepth,el.rightDepth)});return}
      if(k==='ksink'){commit(()=>{el.sinkAt=clamp(v,30,kp.W-30)});return}
      if(k==='kcookAt'){commit(()=>{el.cooktopAt=v});return}
    }
    if(k==='fw'){if(v<=0)return bad();commit(()=>{el.width=r2(v/sx);if(hostOf(el))seatOnHost(el)})}
    else if(k==='fd'){if(v<=0)return bad();commit(()=>{el.depth=r2(v/sy);if(hostOf(el))seatOnHost(el)})}
    else if(k==='rotation'){commit(()=>{el.rotation=((v%360)+360)%360})}
  }else if(sel.kind==='line'){
    if(k==='llen'){if(v<1)return bad();const L=dist(el.start,el.end)||1,ux=(el.end.x-el.start.x)/L,uy=(el.end.y-el.start.y)/L;
      commit(()=>setPt(el.end,{x:r2(el.start.x+ux*v),y:r2(el.start.y+uy*v)}))}
  }
}
function applySeg(g,v){
  if(g==='fixed'){settings.fixedEnd=v;saveNow();refreshPanel();render();return}
  if(g==='join'){setJoin(v==='1');return}
  const el=getSel();if(!el)return;
  if(g==='swing')commit(()=>{if((el.swingDirection||'left')===v)return false;el.swingDirection=v});
  if(g==='flip')commit(()=>{const f=v==='1';if(!!el.flipSide===f)return false;el.flipSide=f});
  if(g==='ns')commit(()=>{if((el.nightstands||'none')===v)return false;el.nightstands=v});
  if(g==='kcook')commit(()=>{el.cooktopLeg=v});
  if(g==='lcolor'||g==='pcolor')commit(()=>{if(el.color===v)return false;el.color=v});
  if(g==='lw')commit(()=>{el.width=+v});
}
function panelAction(a){
  if(a==='mini'){settings.panelMini=!settings.panelMini;saveNow();refreshPanel();return}
  const el=getSel();if(a==='close'){sel=null;refreshPanel();render();return}if(!el)return;const k=sel.kind;
  if(a==='del'){commit(()=>{const f=floor();if(k==='wall'){['doors','windows'].forEach(x=>{if(Array.isArray(f[x]))f[x]=f[x].filter(o=>String(o.wallId)!==String(el.id))});
      for(const o of furn())if(String(o.hostWallId)===String(el.id))delete o.hostWallId}
      f[ARR[k]]=f[ARR[k]].filter(e=>e!==el)});sel=null;refreshPanel();render();return}
  if(a==='delVtx'){const i=vtxSel();if(i==null||el.points.length<=3)return;commit(()=>{el.points.splice(i,1)});selVtx=null;refreshPanel();render();return}
  if(a==='addDoor'||a==='addWin'){addOpening(a==='addDoor'?'door':'window',el,wg(el).L/2);return}
  if(a==='flip'){commit(()=>{const s={x:el.start.x,y:el.start.y};el.start.x=el.end.x;el.start.y=el.end.y;el.end.x=s.x;el.end.y=s.y;
      for(const x of openings())if(String(x.o.wallId)===String(el.id)){x.o.position=r8(1-x.o.position);if(x.kind==='door'){x.o.flipSide=!x.o.flipSide;x.o.swingDirection=(x.o.swingDirection||'left')==='left'?'right':'left'}}});return}
  if(a==='flipBoth'){commit(()=>{el.flipSide=!el.flipSide;el.swingDirection=(el.swingDirection||'left')==='left'?'right':'left'});return}
  if(a==='rotL'||a==='rotR'){commit(()=>{el.rotation=(((el.rotation||0)+(a==='rotR'?90:-90))%360+360)%360});return}
  if(a==='side'){commit(()=>{const w=hostOf(el);if(!w)return false;const c=hostCoords(el.position,w.start,w.end);placeOn(el,w,c.along,-c.sd)});return}
  if(a==='mirror'){commit(()=>{if(!el.scale)el.scale={x:1,y:1,z:1};el.scale.x=-(el.scale.x||1);if(hostOf(el))seatOnHost(el)});return}
  if(a==='dup'){let id;commit(()=>{const c=JSON.parse(JSON.stringify(el));delete c.revitId;delete c.revitUniqueId;id=newId('f-');c.id=id;
    const w=hostOf(el);if(w){const G=wg(w),z=furnSize(el),ha=backLocal(el).x?z.d/2:z.w/2;c.position={x:r2(el.position.x+G.ux*(2*ha+10)),y:r2(el.position.y+G.uy*(2*ha+10))}}
    else c.position={x:r2(el.position.x+30),y:r2(el.position.y+30)};
    ensureArr('furniture').push(c);if(w)seatOnHost(c)});sel={kind:'furniture',id};refreshPanel();render()}
}

// PNG: draw at k× pixel density so text and line widths stay legible on a ~3000 px image
function renderPNG(){
  const b=planBounds()||{x0:0,y0:0,x1:500,y1:500};const pad=60,bw=b.x1-b.x0,bh=b.y1-b.y0;
  const s=clamp(3000/Math.max(bw,bh),0.5,4),k=2.5;const Wc=Math.ceil(bw*s+2*pad),Hc=Math.ceil(bh*s+2*pad);
  const c=document.createElement('canvas');c.width=Wc;c.height=Hc;const x=c.getContext('2d');
  const sv=sel;sel=null;draw(x,{s:s/k,ox:(pad-b.x0*s)/k,oy:(pad-b.y0*s)/k},Wc/k,Hc/k,k,true);sel=sv;return c;
}
function exportPNG(){
  const c=renderPNG();
  c.toBlob(async blob=>{const name=fileBase()+'.png';
    try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})&&'ontouchend' in document){await navigator.share({files:[f],title:project.name});return}}catch(e){if(e&&e.name==='AbortError')return}
    download(blob,name)},'image/png');
}

  importText,exportText,getProject:()=>project,
  setWallLength:(id,L,fixed)=>{const w=wallById(id);if(!w)throw new Error('no wall '+id);commit(()=>setWallLength(w,L,fixed||'start'))},
  moveWall:(id,off)=>{const w=wallById(id);if(!w)throw new Error('no wall '+id);const G=wg(w);
    commit(()=>{const g=beginGeom();translateWall(g,g.walls.find(x=>x.w===w),{x:G.nx*off,y:G.ny*off})})},
  spaceDims:()=>spaceDims().map(d=>({len:r2(d.len),a:{x:r2(d.a.x),y:r2(d.a.y)},b:{x:r2(d.b.x),y:r2(d.b.y)}})),
  opDist:id=>{const o=openings().find(x=>x.o.id===id);return o?opDist(o.o,wallById(o.o.wallId)):null},
  select:(kind,id)=>{sel={kind,id};refreshPanel();render()},
  tempDims:()=>{draw(ctx,view,cw,ch,dpr,false);return tempDims.map(t=>({value:t.value,x:t.L.x,y:t.L.y}))},
  applyTempDim:(i,v)=>{draw(ctx,view,cw,ch,dpr,false);const td=tempDims[i];if(!td)throw new Error('no dim '+i);commit(()=>td.apply(v))},
  view:()=>({...view}),undo,redo,fit,renderPNG
};
boot();
})();
</script>
</body>
</html>
