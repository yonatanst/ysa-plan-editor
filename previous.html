<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

</style></head><body>
<div id="bar">
 <button data-tool="select" class="on">בחירה</button>

<input type="file" id="file" accept=".json,application/json,text/plain" style="display:none">
<script>
"use strict";
const FURN={"bed-double":[160,200,"מיטה"],"sofa":[200,90,"ספה"],"table":[160,90,"שולחן"],"chair":[45,45,"כיסא"],"wardrobe":[180,60,"ארון"],"kitchen-counter":[240,60,"מטבח"],"toilet":[40,65,"אסלה"],"sink":[60,45,"כיור"],"bathtub":[170,75,"אמבטיה"],"shower":[90,90,"מקלחת"]};
const DOORT={single:"רגילה",double:"כפולה",sliding:"הזזה",french:"צרפתית",pocket:"כיס",bifold:"מתקפלת",opening:"פתח",garage:"חניה"};
const WINT={standard:"רגיל",fixed:"קבוע",casement:"ציר",sliding:"הזזה",bay:"בולט"};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let project,fi=0,tool='select',sel=null,snapOn=true;
let view={s:0.5,ox:100,oy:100};
let undoS=[],redoS=[];
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const F=()=>project.floors[fi];
const r1=v=>Math.round(v*10)/10;
function blank(){const id=uid('floor');return{id:uid('project'),name:'תוכנית חדשה',floors:[{id,name:'קומה 0',level:0,walls:[],doors:[],windows:[],furniture:[],rooms:[]}],activeFloorId:id,createdAt:new Date().toISOString()}}
function normalize(p){if(!p||typeof p!=='object'||!Array.isArray(p.floors)||!p.floors.length)throw new Error('אין floors בקובץ');
 if(!p.id)p.id=uid('project');
 for(const f of p.floors){if(!Array.isArray(f.walls))throw new Error('בקומה חסר walls');for(const k of['doors','windows','furniture'])if(!Array.isArray(f[k]))f[k]=[];}
 return p}
function snap(){return JSON.stringify(project)}
function push(){undoS.push(snap());if(undoS.length>200)undoS.shift();redoS=[];save()}
function save(){try{project.updatedAt=new Date().toISOString();localStorage.setItem('planEditor',snap())}catch(e){}}
function restore(s){project=JSON.parse(s);if(fi>=project.floors.length)fi=0;sel=null;floors();panel();draw();save()}
// geometry
const W2S=(x,y)=>[x*view.s+view.ox,y*view.s+view.oy];
const S2W=(x,y)=>[(x-view.ox)/view.s,(y-view.oy)/view.s];
const len=w=>Math.hypot(w.end.x-w.start.x,w.end.y-w.start.y);
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;let t=L?((p.x-a.x)*dx+(p.y-a.y)*dy)/L:0;t=Math.max(0,Math.min(1,t));return[Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy),t]}
const wallById=id=>F().walls.find(w=>w.id===id);
function opPoint(o){const w=wallById(o.wallId);if(!w)return null;return{x:w.start.x+(w.end.x-w.start.x)*o.position,y:w.start.y+(w.end.y-w.start.y)*o.position,w}}
function snapPoint(p,from,excl){const tol=22/view.s;let best=null,bd=tol;
 if(snapOn){for(const w of F().walls){if(w===excl)continue;for(const q of[w.start,w.end]){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best={x:q.x,y:q.y}}}}}
 if(best)return{p:best,ep:true};
 let x=p.x,y=p.y;
 if(snapOn&&from){const dx=x-from.x,dy=y-from.y,a=Math.abs(Math.atan2(dy,dx)*180/Math.PI);
  if(a<8||a>172)y=from.y;else if(Math.abs(a-90)<8)x=from.x;
  // snap length to 5cm along direction
  const L=Math.hypot(x-from.x,y-from.y);if(L>0){const L2=Math.round(L/5)*5;x=from.x+(x-from.x)*L2/L;y=from.y+(y-from.y)*L2/L}
 }else if(snapOn){x=Math.round(x/5)*5;y=Math.round(y/5)*5}
 return{p:{x:r1(x),y:r1(y)},ep:false}}
// drawing
function resize(){const top=document.getElementById('bar').offsetHeight;cv.style.top=top+'px';const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=(innerHeight-top)*d;cv.style.width=innerWidth+'px';cv.style.height=(innerHeight-top)+'px';draw()}
function drawPlan(c,v,forPng){const P=(x,y)=>[x*v.s+v.ox,y*v.s+v.oy];const f=F();
 // grid
 if(!forPng){const step=v.s>0.6?50:100;c.strokeStyle='#dde3ea';c.lineWidth=1;const[x0,y0]=[(0-v.ox)/v.s,(0-v.oy)/v.s],[x1,y1]=[(c.canvas.width/(devicePixelRatio||1)-v.ox)/v.s,(c.canvas.height/(devicePixelRatio||1)-v.oy)/v.s];c.beginPath();for(let x=Math.floor(x0/step)*step;x<x1;x+=step){const[a]=P(x,0);c.moveTo(a,0);c.lineTo(a,9999)}for(let y=Math.floor(y0/step)*step;y<y1;y+=step){const[,b]=P(0,y);c.moveTo(0,b);c.lineTo(9999,b)}c.stroke()}
 for(const w of f.walls){const[a,b]=P(w.start.x,w.start.y),[cc,d]=P(w.end.x,w.end.y);c.lineCap='butt';c.lineWidth=Math.max(2,w.thickness*v.s);c.strokeStyle=(sel&&sel.o===w&&!forPng)?'#2563eb':'#374151';c.beginPath();c.moveTo(a,b);c.lineTo(cc,d);c.stroke()}
 // joints
 for(const w of f.walls)for(const q of[w.start,w.end]){const[a,b]=P(q.x,q.y);c.fillStyle='#374151';c.fillRect(a-w.thickness*v.s/2,b-w.thickness*v.s/2,w.thickness*v.s,w.thickness*v.s)}
 const ops=[...f.doors.map(o=>[o,'d']),...f.windows.map(o=>[o,'w'])];
 for(const[o,k]of ops){const q=opPoint(o);if(!q)continue;const w=q.w,L=len(w)||1,ux=(w.end.x-w.start.x)/L,uy=(w.end.y-w.start.y)/L,hw=o.width/2;
  const A={x:q.x-ux*hw,y:q.y-uy*hw},B={x:q.x+ux*hw,y:q.y+uy*hw};const[ax,ay]=P(A.x,A.y),[bx,by]=P(B.x,B.y);
  c.strokeStyle='#fff';c.lineWidth=w.thickness*v.s+2;c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();
  const isSel=sel&&sel.o===o&&!forPng;c.strokeStyle=isSel?'#2563eb':(k==='w'?'#0891b2':'#b45309');c.lineWidth=isSel?3:2;
  if(k==='w'){for(const off of[-1,0,1]){const nx=-uy*off*w.thickness/3,ny=ux*off*w.thickness/3;const[p1,p2]=P(A.x+nx,A.y+ny),[p3,p4]=P(B.x+nx,B.y+ny);c.beginPath();c.moveTo(p1,p2);c.lineTo(p3,p4);c.stroke()}}
  else{let nx=-uy,ny=ux;if(o.flipSide){nx=-nx;ny=-ny}const t=o.type||'single';
   const leaf=(H,ow,dir)=>{const[hx,hy]=P(H.x,H.y);const tip={x:H.x+nx*ow,y:H.y+ny*ow};const[tx,ty]=P(tip.x,tip.y);c.beginPath();c.moveTo(hx,hy);c.lineTo(tx,ty);c.stroke();const a0=Math.atan2(ny,nx),a1=Math.atan2(dir.y,dir.x);c.beginPath();let d=a1-a0;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;c.arc(hx,hy,ow*v.s,a0,a1,d<0);c.stroke()};
   if(['sliding','pocket','bifold','opening'].includes(t)){c.setLineDash([6,4]);c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();c.setLineDash([])}
   else if(t==='double'||t==='french'){leaf(A,hw,{x:ux,y:uy});leaf(B,hw,{x:-ux,y:-uy})}
   else{const left=(o.swingDirection||'left')==='left';leaf(left?B:A,o.width,left?{x:-ux,y:-uy}:{x:ux,y:uy})}}
 }
 for(const o of f.furniture){const df=FURN[o.catalogId]||[50,50,o.catalogId];const wd=(o.width||df[0])*Math.abs(o.scale?.x??1),dp=(o.depth||df[1])*Math.abs(o.scale?.y??1);const[a,b]=P(o.position.x,o.position.y);c.save();c.translate(a,b);c.rotate((o.rotation||0)*Math.PI/180);c.fillStyle='#fef3c7cc';c.strokeStyle=(sel&&sel.o===o&&!forPng)?'#2563eb':'#92400e';c.lineWidth=2;c.fillRect(-wd*v.s/2,-dp*v.s/2,wd*v.s,dp*v.s);c.strokeRect(-wd*v.s/2,-dp*v.s/2,wd*v.s,dp*v.s);c.fillStyle='#92400e';c.font='12px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(df[2],0,0);c.restore()}
 // dimensions
 c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';
 for(const w of f.walls){const L=len(w);if(L*v.s<40)continue;const ux=(w.end.x-w.start.x)/L,uy=(w.end.y-w.start.y)/L,off=w.thickness/2+18/v.s;const mx=(w.start.x+w.end.x)/2-uy*off,my=(w.start.y+w.end.y)/2+ux*off;const[a,b]=P(mx,my);let ang=Math.atan2(uy,ux);if(ang>Math.PI/2)ang-=Math.PI;if(ang<-Math.PI/2)ang+=Math.PI;c.save();c.translate(a,b);c.rotate(ang);const t=r1(L)+'';const tw=c.measureText(t).width+6;c.fillStyle='#ffffffd0';c.fillRect(-tw/2,-9,tw,18);c.fillStyle='#be123c';c.fillText(t,0,0);c.restore()}
}
function draw(){if(!project)return;const d=devicePixelRatio||1;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,cv.width,cv.height);drawPlan(ctx,view,false);
 // selection handles
 if(sel&&sel.k==='wall'){for(const q of[sel.o.start,sel.o.end]){const[a,b]=W2S(q.x,q.y);ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(a,b,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(a,b,5,0,7);ctx.fill()}}
 if(draft){const[a,b]=W2S(draft.s.x,draft.s.y);ctx.fillStyle='#16a34a';ctx.beginPath();ctx.arc(a,b,9,0,7);ctx.fill();if(draft.e){const[c2,d2]=W2S(draft.e.x,draft.e.y);ctx.strokeStyle='#16a34a99';ctx.lineWidth=Math.max(3,wallDefaults.thickness*view.s);ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c2,d2);ctx.stroke();const L=Math.hypot(draft.e.x-draft.s.x,draft.e.y-draft.s.y);ctx.font='bold 18px sans-serif';ctx.fillStyle='#15803d';ctx.textAlign='center';ctx.fillText(r1(L)+' ס"מ',c2,d2-26);if(draft.ep){ctx.strokeStyle='#dc2626';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c2,d2,14,0,7);ctx.stroke()}}}
}
// tools
let draft=null;const wallDefaults={thickness:20,height:280,wallType:''};
function hit(p){const f=F(),tol=18/view.s;
 for(const o of f.furniture){const df=FURN[o.catalogId]||[50,50];const wd=o.width||df[0],dp=o.depth||df[1];const r=-(o.rotation||0)*Math.PI/180,dx=p.x-o.position.x,dy=p.y-o.position.y;const lx=dx*Math.cos(r)-dy*Math.sin(r),ly=dx*Math.sin(r)+dy*Math.cos(r);if(Math.abs(lx)<=wd/2&&Math.abs(ly)<=dp/2)return{k:'furniture',o}}
 for(const[arr,k]of[[f.doors,'door'],[f.windows,'window']])for(const o of arr){const q=opPoint(o);if(q&&Math.hypot(q.x-p.x,q.y-p.y)<Math.max(o.width/2,tol))return{k,o}}
 let best=null,bd=Infinity;for(const w of f.walls){const[d]=segDist(p,w.start,w.end);if(d<Math.max(w.thickness/2+tol*0.5,tol)&&d<bd){bd=d;best={k:'wall',o:w}}}return best}
function nearestWall(p){let best=null,bd=40/view.s+30;for(const w of F().walls){const[d,t]=segDist(p,w.start,w.end);if(d<bd){bd=d;best={w,t}}}return best}
function setTool(t){tool=t;draft=null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));document.getElementById('endChain').style.display=t==='wall'?'':'none';if(t!=='select'){sel=null;panel()}draw();
 const tips={wall:'הקש נקודת התחלה ואז נקודת סיום (או גרור). הקירות משורשרים – "סיום קיר" לעצירה',door:'הקש על קיר כדי להוסיף דלת',window:'הקש על קיר כדי להוסיף חלון',furniture:'הקש כדי להציב ריהוט'};if(tips[t])toast(tips[t])}
function toast(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>m.style.display='none',2500)}
// pointers
const ptrs=new Map();let gesture=null,drag=null,downInfo=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
 if(ptrs.size===2){drag=null;downInfo=null;const[a,b]=[...ptrs.values()];gesture={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,v:{...view}};return}
 if(ptrs.size>2)return;
 const p=S2W(e.offsetX,e.offsetY),wp={x:p[0],y:p[1]};downInfo={x:e.offsetX,y:e.offsetY,wp,t:Date.now(),moved:false,pt:e.pointerType};
 if(tool==='select'){
  if(sel&&sel.k==='wall'){for(const key of['start','end']){const q=sel.o[key];const[a,b]=W2S(q.x,q.y);if(Math.hypot(a-e.offsetX,b-e.offsetY)<26){drag={type:'ep',w:sel.o,key,orig:{...q},others:connected(q,sel.o),pushed:false};return}}}
  const h=hit(wp);if(h){sel=h;panel();draw();if(h.k==='furniture')drag={type:'furn',o:h.o,off:{x:wp.x-h.o.position.x,y:wp.y-h.o.position.y},pushed:false};else if(h.k==='door'||h.k==='window')drag={type:'op',o:h.o,pushed:false};else drag={type:'pan',v:{...view}};}
  else{drag={type:'pan',v:{...view},desel:true}}
 }else if(tool==='wall'){const sp=snapPoint(wp,draft?draft.s:null);if(!draft){draft={s:sp.p,e:null,dragStart:true}}else{draft.e=sp.p;draft.ep=sp.ep}draw()}
});
function connected(q,exw){const r=[];for(const w of F().walls){if(w===exw)continue;for(const k of['start','end'])if(Math.abs(w[k].x-q.x)<0.5&&Math.abs(w[k].y-q.y)<0.5)r.push([w,k])}return r}
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
 if(gesture&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;const s=Math.min(8,Math.max(0.03,gesture.v.s*d/gesture.d));const wx=(gesture.cx-gesture.v.ox)/gesture.v.s,wy=(gesture.cy-gesture.v.oy)/gesture.v.s;view.s=s;view.ox=cx-wx*s;view.oy=cy-wy*s;draw();return}
 if(!downInfo)return;if(Math.hypot(e.offsetX-downInfo.x,e.offsetY-downInfo.y)>6)downInfo.moved=true;if(!downInfo.moved)return;
 const p=S2W(e.offsetX,e.offsetY),wp={x:p[0],y:p[1]};
 if(tool==='wall'&&draft){const sp=snapPoint(wp,draft.s);draft.e=sp.p;draft.ep=sp.ep;draw();return}
 if(!drag)return;
 if(drag.type==='pan'){view.ox=drag.v.ox+e.offsetX-downInfo.x;view.oy=drag.v.oy+e.offsetY-downInfo.y;draw();return}
 if(!drag.pushed){push();drag.pushed=true}
 if(drag.type==='ep'){const other=drag.key==='start'?drag.w.end:drag.w.start;const sp=snapPoint(wp,other,drag.w);drag.w[drag.key].x=sp.p.x;drag.w[drag.key].y=sp.p.y;for(const[w,k]of drag.others){w[k].x=sp.p.x;w[k].y=sp.p.y}}
 else if(drag.type==='furn'){let x=wp.x-drag.off.x,y=wp.y-drag.off.y;if(snapOn){x=Math.round(x/5)*5;y=Math.round(y/5)*5}drag.o.position.x=x;drag.o.position.y=y}
 else if(drag.type==='op'){const w=wallById(drag.o.wallId);if(w){let[,t]=segDist(wp,w.start,w.end);const L=len(w);if(snapOn&&L){t=Math.round(t*L/5)*5/L}drag.o.position=Math.max(0,Math.min(1,+t.toFixed(5)))}}
 draw();panel(true)});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(gesture){if(ptrs.size<2)gesture=null;downInfo=null;drag=null;return}
 if(!downInfo)return;const di=downInfo;downInfo=null;
 if(tool==='wall'&&draft){if(draft.e&&Math.hypot(draft.e.x-draft.s.x,draft.e.y-draft.s.y)>=1){addWall(draft.s,draft.e);const wasEp=draft.ep;draft={s:{...draft.e},e:null};if(wasEp&&!di.moved){}}else if(di.moved){}draw();drag=null;return}
 if(tool==='select'&&drag&&drag.desel&&!di.moved){sel=null;panel();draw()}
 if(!di.moved){const wp=di.wp;
  if(tool==='door'||tool==='window'){const nw=nearestWall(wp);if(nw){push();const L=len(nw.w);const o=tool==='door'?{id:uid('door'),wallId:nw.w.id,position:0,width:90,height:210,type:'single',swingDirection:'left',flipSide:false}:{id:uid('window'),wallId:nw.w.id,position:0,width:120,height:120,type:'standard',sillHeight:90};let t=nw.t;if(L){t=Math.round(t*L/5)*5/L}o.position=+Math.max(0,Math.min(1,t)).toFixed(5);F()[tool+'s'].push(o);sel={k:tool,o};setTool('select');sel={k:o.type&&DOORT[o.type]?'door':'window',o};sel.k=o.id.startsWith('door')?'door':'window';panel();draw()}else toast('יש להקיש על קיר')}
  if(tool==='furniture'){push();const ft=document.getElementById('furnType').value;const o={id:uid('furn'),catalogId:ft,position:{x:Math.round(wp.x/5)*5,y:Math.round(wp.y/5)*5},rotation:0,width:FURN[ft][0],depth:FURN[ft][1]};F().furniture.push(o);setTool('select');sel={k:'furniture',o};panel();draw()}}
 drag=null;draw()}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const f=Math.exp(-e.deltaY*0.0015);const s=Math.min(8,Math.max(0.03,view.s*f));const wx=(e.offsetX-view.ox)/view.s,wy=(e.offsetY-view.oy)/view.s;view.s=s;view.ox=e.offsetX-wx*s;view.oy=e.offsetY-wy*s;draw()},{passive:false});

function addWall(s,e){push();const w={id:uid('wall'),start:{x:s.x,y:s.y},end:{x:e.x,y:e.y},thickness:wallDefaults.thickness,height:wallDefaults.height};if(wallDefaults.wallType)w.wallType=wallDefaults.wallType;F().walls.push(w);return w}
// panel
function field(lbl,val,on,type='number'){return`<label>${lbl}<input type="${type}" inputmode="decimal" step="any" value="${val}" data-f="${on}"></label>`}
function panel(liveOnly){const pn=document.getElementById('panel');if(!sel){pn.style.display='none';return}
 if(liveOnly&&document.activeElement&&pn.contains(document.activeElement))return;
 const o=sel.o;let h='';
 if(sel.k==='wall'){const L=len(o),ang=Math.atan2(o.end.y-o.start.y,o.end.x-o.start.x)*180/Math.PI;h+=`<b>קיר</b> <small dir="ltr">${o.id}${o.revitId!=null?' · revitId '+o.revitId:''}</small><br>`+field('אורך (ס"מ)',r1(L),'len')+field('עובי (ס"מ)',o.thickness,'thickness')+field('גובה (ס"מ)',o.height??280,'height')+field('זווית (°)',r1(ang),'ang')+field('סוג קיר',(o.wallType??o.typeName??'').toString().replace(/"/g,'&quot;'),o.typeName!=null&&o.wallType==null?'typeName':'wallType','text')+`<br><label>שינוי אורך מ:<select data-f="anchor"><option value="start">קצה סיום זז</option><option value="end">קצה התחלה זז</option><option value="mid">משני הצדדים</option></select></label><button id="defW">קבע כברירת מחדל לקירות חדשים</button><button class="danger" id="del">מחיקה</button>`}
 else if(sel.k==='door'||sel.k==='window'){const w=wallById(o.wallId),L=w?len(w):0;h+=`<b>${sel.k==='door'?'דלת':'חלון'}</b> <small dir="ltr">${o.id}${o.revitId!=null?' · revitId '+o.revitId:''}</small><br>`+field('רוחב',o.width,'width')+field('גובה',o.height??'', 'height')+field('מרחק מרכז מתחילת הקיר',r1(o.position*L),'dist')+field('מרחק קצה מתחילת הקיר',r1(o.position*L-o.width/2),'edist');
  if(sel.k==='door'){h+=`<label>סוג<select data-f="type">${Object.entries(DOORT).map(([k,v])=>`<option value="${k}"${(o.type||'single')===k?' selected':''}>${v}</option>`).join('')}</select></label><button id="flipS">היפוך צד</button><button id="flipH">היפוך ציר</button>`}
  else{h+=field('גובה אדן',o.sillHeight??90,'sillHeight')+`<label>סוג<select data-f="type">${Object.entries(WINT).map(([k,v])=>`<option value="${k}"${(o.type||'standard')===k?' selected':''}>${v}</option>`).join('')}</select></label>`}
  h+=`<button class="danger" id="del">מחיקה</button>`}
 else if(sel.k==='furniture'){const df=FURN[o.catalogId]||[50,50,o.catalogId];h+=`<b>${df[2]}</b> <small dir="ltr">${o.id}${o.revitId!=null?' · revitId '+o.revitId:''}</small><br>`+field('רוחב',o.width??df[0],'width')+field('עומק',o.depth??df[1],'depth')+field('סיבוב (°)',o.rotation||0,'rotation')+field('X',r1(o.position.x),'px')+field('Y',r1(o.position.y),'py')+`<button id="rot90">סיבוב 90°</button><button class="danger" id="del">מחיקה</button>`}
 pn.innerHTML=h;pn.style.display='block';
 pn.querySelectorAll('[data-f]').forEach(inp=>{if(inp.dataset.f==='anchor'){inp.value=panel.anchor||'start';inp.onchange=()=>panel.anchor=inp.value;return}inp.onchange=()=>applyField(inp.dataset.f,inp.value);inp.onkeydown=ev=>{if(ev.key==='Enter')inp.blur()}});
 const b=id=>pn.querySelector('#'+id);
 if(b('del'))b('del').onclick=()=>{push();const f=F();if(sel.k==='wall'){f.walls=f.walls.filter(w=>w!==o);f.doors=f.doors.filter(d=>d.wallId!==o.id);f.windows=f.windows.filter(d=>d.wallId!==o.id)}else{const k=sel.k==='furniture'?'furniture':sel.k+'s';f[k]=f[k].filter(x=>x!==o)}sel=null;panel();draw()};
 if(b('flipS'))b('flipS').onclick=()=>{push();o.flipSide=!o.flipSide;draw()};
 if(b('flipH'))b('flipH').onclick=()=>{push();o.swingDirection=(o.swingDirection||'left')==='left'?'right':'left';draw()};
 if(b('rot90'))b('rot90').onclick=()=>{push();o.rotation=((o.rotation||0)+90)%360;panel();draw()};
 if(b('defW'))b('defW').onclick=()=>{wallDefaults.thickness=o.thickness;wallDefaults.height=o.height??280;wallDefaults.wallType=o.wallType||'';toast('נשמר: עובי '+o.thickness)};
}
function applyField(f,val){const o=sel.o;const n=parseFloat(val);const isNum=!['wallType','typeName','type'].includes(f);if(isNum&&!isFinite(n)){toast('מספר לא תקין');panel();return}push();
 if(sel.k==='wall'){if(f==='len'||f==='ang'){if(n<=0&&f==='len'){toast('אורך חייב להיות חיובי');undoS.pop();panel();return}const L=len(o),ang=f==='ang'?n*Math.PI/180:Math.atan2(o.end.y-o.start.y,o.end.x-o.start.x),NL=f==='len'?n:L;const ux=Math.cos(ang),uy=Math.sin(ang);const a=panel.anchor||'start';
   // preserve opening absolute positions from start
   const ops=[...F().doors,...F().windows].filter(d=>d.wallId===o.id).map(d=>[d,d.position*L]);
   const cs=connected(o.start,o),ce=connected(o.end,o);let S={...o.start},E={...o.end};
   if(a==='start'){E={x:S.x+ux*NL,y:S.y+uy*NL}}else if(a==='end'){S={x:E.x-ux*NL,y:E.y-uy*NL}}else{const mx=(S.x+E.x)/2,my=(S.y+E.y)/2;S={x:mx-ux*NL/2,y:my-uy*NL/2};E={x:mx+ux*NL/2,y:my+uy*NL/2}}
   S={x:r1(S.x),y:r1(S.y)};E={x:r1(E.x),y:r1(E.y)};
   const shift=a==='end'?NL-L:a==='mid'?(NL-L)/2:0;
   o.start.x=S.x;o.start.y=S.y;o.end.x=E.x;o.end.y=E.y;for(const[w,k]of cs){w[k].x=S.x;w[k].y=S.y}for(const[w,k]of ce){w[k].x=E.x;w[k].y=E.y}
   for(const[d,dist]of ops)d.position=+Math.max(0,Math.min(1,(dist+shift)/NL)).toFixed(5)}
  else if(f==='thickness'){if(n<=0){toast('עובי חייב להיות חיובי');undoS.pop();return}o.thickness=n}else if(f==='height')o.height=n;else o[f]=val}
 else if(sel.k==='door'||sel.k==='window'){const w=wallById(o.wallId),L=w?len(w):1;if(f==='dist')o.position=+Math.max(0,Math.min(1,n/L)).toFixed(5);else if(f==='edist')o.position=+Math.max(0,Math.min(1,(n+o.width/2)/L)).toFixed(5);else if(f==='type')o.type=val;else o[f]=n}
 else if(sel.k==='furniture'){if(f==='px')o.position.x=n;else if(f==='py')o.position.y=n;else o[f]=n}
 panel();draw()}

function fit(){const f=F();let xs=[],ys=[];for(const w of f.walls){xs.push(w.start.x,w.end.x);ys.push(w.start.y,w.end.y)}for(const o of f.furniture){xs.push(o.position.x);ys.push(o.position.y)}if(!xs.length){view={s:0.5,ox:60,oy:60};draw();return}const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const W=cv.clientWidth,H=cv.clientHeight;const s=Math.min((W-80)/Math.max(1,x1-x0),(H-80)/Math.max(1,y1-y0),4);view={s,ox:(W-(x1-x0)*s)/2-x0*s,oy:(H-(y1-y0)*s)/2-y0*s};draw()}

document.getElementById('png').onclick=()=>{const f=F();let xs=[],ys=[];for(const w of f.walls){xs.push(w.start.x,w.end.x);ys.push(w.start.y,w.end.y)}for(const o of f.furniture){xs.push(o.position.x);ys.push(o.position.y)}if(!xs.length){toast('אין מה לייצא');return}const pad=80,x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad,W=Math.max(...xs)+pad-x0,H=Math.max(...ys)+pad-y0;const s=Math.min(2,4000/Math.max(W,H));const c=document.createElement('canvas');c.width=W*s;c.height=H*s;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);const ss=sel;sel=null;drawPlan(g,{s,ox:-x0*s,oy:-y0*s},true);sel=ss;c.toBlob(b=>download(safeName()+'.png',b),'image/png')};
